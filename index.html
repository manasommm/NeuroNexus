<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LANDING PAGE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form class="form-container" action="#" method="post">
    <h1>📝 Internship Application</h1>

    <label for="fullname">👤 Full Name</label>
    <input type="text" id="fullname" name="fullname" required />

    <label for="phone">📞 Contact Number</label>
    <div class="phone-wrapper">
      <select name="country-code" required>
        <option value="+91">🇮🇳 +91</option>
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+61">🇦🇺 +61</option>
      </select>
      <input type="tel" name="phone" id="phone" required />
    </div>

    <label for="address">🏠 Address</label>
    <textarea id="address" name="address" rows="3" required></textarea>

    <label for="company">🏢 Company Name</label>
    <input type="text" id="company" name="company" required />

    <label for="email">📧 Email Address</label>
    <input type="email" id="email" name="email" required />

    <label for="department">🗂️ Department</label>
    <select id="department" name="department" required>
      <option value="">-- Select --</option>
      <option value="HR">HR</option>
      <option value="Sales">Sales</option>
      <option value="Development">Development</option>
      <option value="Marketing">Marketing</option>
      <option value="Others">Others</option>
    </select>

    <label>⚧️ Gender</label>
    <div class="radio-group">
      <label><input type="radio" name="gender" value="Male" required> Male</label>
      <label><input type="radio" name="gender" value="Female" required> Female</label>
      <label><input type="radio" name="gender" value="Prefer not to say" required> Prefer not to say</label>
    </div>

    <div class="buttons">
      <button type="submit" class="btn btn-submit">🚀 Submit</button>
      <button type="reset" class="btn btn-reset">♻️ Reset</button>
    </div>

    <div class="thank-you">🎉 Thank you for submitting! We’ll get back to you soon!</div>
  </form>
</body>
</html>
